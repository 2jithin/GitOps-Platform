apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-gateway
data:
  config.yaml: |
    model_list:
      - model_name: portfolio-coder
        litellm_params:
          model: openai/llama3.2:3b
          api_base: http://ollama.ai-platform.svc.cluster.local:11434/v1
          api_key: ollama
          max_tokens: 512
          timeout: 120
    router_settings:
      enable_pre_call_checks: true
      num_retries: 0
      timeout: 120
    litellm_settings:
      num_retries: 0
      request_timeout: 120
      set_verbose: false
      turn_off_message_logging: true
      default_key_generate_params:
        models: [portfolio-coder]
        allowed_routes: [/v1/chat/completions, /v1/models]
        duration: 7d
        rpm_limit: 6
        tpm_limit: 4096
        max_parallel_requests: 1
      upperbound_key_generate_params:
        duration: 7d
        rpm_limit: 6
        tpm_limit: 4096
        max_parallel_requests: 1
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      disable_env_credential_login: true
      allow_requests_on_db_unavailable: false
      store_model_in_db: false
      database_connection_pool_limit: 5
      database_connection_timeout: 10
      max_request_size_mb: 1
      custom_key_policy: custom_key_policy.custom_key_policy_fn
  custom_key_policy.py: |4
      from datetime import datetime, timedelta, timezone

      ALLOWED_MODELS = {"portfolio-coder"}
      ALLOWED_ROUTES = {"/v1/chat/completions", "/v1/models"}
      MAX_KEY_LIFETIME = timedelta(days=7)
      MAX_RPM = 6
      MAX_TPM = 4096
      MAX_PARALLEL_REQUESTS = 1


      async def custom_key_policy_fn(policy_request):
        key = policy_request.effective_key

        user_id = getattr(key, "user_id", None)
        if not isinstance(user_id, str) or not user_id.strip():
          return {"decision": False, "message": "Keys must belong to a named user."}
        try:
          from litellm.proxy.proxy_server import prisma_client
          from litellm.repositories.user_repository import UserRepository

          if prisma_client is None:
            return {"decision": False, "message": "The key owner could not be verified."}
          user = await UserRepository(prisma_client).table.find_unique(where={"user_id": user_id})
        except Exception:
          return {"decision": False, "message": "The key owner could not be verified."}
        if user is None:
          return {"decision": False, "message": "Keys must belong to an existing user."}

        if set(getattr(key, "models", None) or ()) != ALLOWED_MODELS:
          return {"decision": False, "message": "Keys may access only portfolio-coder."}

        if set(getattr(key, "allowed_routes", None) or ()) != ALLOWED_ROUTES:
          return {"decision": False, "message": "Keys may access only the approved inference routes."}

        expires = getattr(key, "expires", None)
        if not isinstance(expires, datetime):
          return {"decision": False, "message": "Keys must have an expiry of seven days or less."}
        if expires.tzinfo is None:
          expires = expires.replace(tzinfo=timezone.utc)
        now = datetime.now(timezone.utc)
        if expires <= now or expires > now + MAX_KEY_LIFETIME:
          return {"decision": False, "message": "Keys must have an expiry of seven days or less."}

        limits = (
          ("rpm_limit", MAX_RPM),
          ("tpm_limit", MAX_TPM),
          ("max_parallel_requests", MAX_PARALLEL_REQUESTS),
        )
        for field, maximum in limits:
          value = getattr(key, field, None)
          if not isinstance(value, int) or isinstance(value, bool) or value < 1 or value > maximum:
            return {"decision": False, "message": f"{field} must be between 1 and {maximum}."}

        return {"decision": True}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ai-gateway
data:
  01-runtime-role.sql: |
    \getenv runtime_password LITELLM_DATABASE_PASSWORD
    CREATE ROLE litellm LOGIN PASSWORD :'runtime_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
    CREATE DATABASE litellm OWNER litellm;
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-workloads
  namespace: ai-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-gateway
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: default
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: gateway-workloads
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.azure.com/agentpool: worker01
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-postgres-admin
                  key: password
            - name: LITELLM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime
                  key: database-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, postgres]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, postgres]}
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: socket
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: gateway-workloads
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.azure.com/agentpool: worker01
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.106.6
          args: [--config, /config/config.yaml, --port, "4000", --num_workers, "1"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: gateway-runtime, key: database-url}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: gateway-runtime, key: master-key}
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef: {name: gateway-runtime, key: salt-key}
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: PYTHONPATH, value: /config}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: LITELLM_LOCAL_MODEL_COST_MAP, value: "True"}
            - {name: LITELLM_TELEMETRY, value: "False"}
            - {name: NO_DOCS, value: "True"}
            - {name: NO_REDOC, value: "True"}
            - {name: NO_OPENAPI, value: "True"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: litellm-config}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}